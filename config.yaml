      company_slug: Binary-Defense
      fetch_descriptions: true

# --- runtime knobs ---
runtime:
  request_timeout_seconds: 15
  inter_request_delay_ms: 250
  user_agent: "RecruitRecon/0.1 (personal job tracker)"
  verify_company_page: true
  output_json_path: data/jobs.json
  database_path: data/recon.db
  # Auto-delete closed/disappeared jobs older than this many days so the DB
  # doesn't accumulate dead listings forever.  Set to 0 to disable.
  purge_closed_after_days: 60
  # Bounded worker count for per-job verification and per-posting detail
  # fetches (Workday, Paylocity). Each worker still paces itself with
  # inter_request_delay_ms, so this trades wall-clock time for request
  # concurrency without dropping the per-request politeness delay.
  verify_concurrency: 4
