  # OFFENSIVE / PEN TEST SHOPS
  # ===================================================================

  - id: praetorian
    name: Praetorian
    adapter: greenhouse
    config:
      board_token: praetorian

  - id: specterops
    name: SpecterOps
    adapter: greenhouse
    config:
      board_token: specterops

  - id: coalfire
    name: Coalfire
    adapter: lever
    config:
      company: coalfire

  - id: trail-of-bits
    name: Trail of Bits
    adapter: workable
    config:
      account: trailofbits

  - id: black-lantern
    name: Black Lantern Security
    adapter: html_scraper
    config:
      url: https://www.blacklanternsecurity.com/careers/
      mode: container
      job_selector: "div.accordion-header"
      title_selector: "self"
      shared_apply_link_selector: "a[href*='monday.com']"

  - id: deepwatch
    name: Deepwatch
    adapter: greenhouse
    # MDR platform + pen test services. Explicitly GCIH/GPEN-track roles.
    # Correct token is "deepwatchinc" — deepwatch and deepwatchsec both 404.
    config:
      board_token: deepwatchinc

  - id: rhino-security-labs
    name: Rhino Security Labs
    adapter: workable
    # Boutique offensive security firm (coined the SSRF-in-cloud-metadata attack).
    # Small team; occasional consultant and researcher openings.
    config:
      account: rhino-security-labs

  - id: ncc-group
    name: NCC Group
    adapter: workday
    # Major UK-headquartered consultancy with strong North American presence.
    # Explicit Junior Security Consultant → Penetration Tester pipeline.
    # NOTE: Their global Workday board sometimes returns zero results even
    # when LinkedIn shows active openings. They may publish to region-specific
    # sub-boards. If you see persistent zero results, manually check
    # nccgroup.wd3.myworkdayjobs.com to find the correct site_id for North America.
    config:
      tenant: nccgroup
      region: wd3
      site_id: NCC_Group
      locale: en-US

  - id: optiv
    name: Optiv
    adapter: workday
    # Large security solutions integrator. Has an explicit Associates Program
    # for new grads, career changers, and military veterans — that's your
    # demographic. Roles span pen testing, SOC, and consulting.
    config:
      tenant: optiv
      region: wd5
      site_id: Optiv_Careers
      locale: en-US

  - id: bugcrowd
    name: Bugcrowd
    adapter: greenhouse
    # Bug bounty platform. Application Security Engineers triage incoming
    # vulnerability submissions for bounty programs run on their platform.
    # Excellent learning role: you'll see hundreds of OWASP Top 10 reports
    # against real-world apps. Strong Burp Suite + scripting requirements.
    config:
      board_token: bugcrowd

  - id: synack-srt
    name: Synack Red Team
    adapter: greenhouse
    # NOT a W-2 employee role — this is contract/freelance pen testing on
    # Synack's platform. Apply once, get vetted, take engagements when you
    # want. Worth keeping on the board because it's an excellent post-GPEN
    # side-income channel even if you have a full-time job elsewhere.
    config:
      board_token: synacksrt

  - id: hackerone
    name: HackerOne
    adapter: ashby
    # Bug bounty / VDP platform. Hires triage analysts ("Hai Triage Analyst"),
    # security engineers, and product roles. Many roles are remote.
    # Slug found at jobs.ashbyhq.com/hackerone
    config:
      slug: hackerone

  - id: sentinelone
    name: SentinelOne
    adapter: greenhouse
    # XDR/EDR platform vendor. Hires detection engineers, threat hunters,
    # and IR consultants via their Vigilance MDR arm. The careers site wraps
    # a standard Greenhouse embed — correct token is "sentinellabs".
    # URL parameter gh_jid confirms Greenhouse: sentinelone.com/jobs/?gh_jid=...
    config:
      board_token: sentinellabs

  - id: recorded-future
    name: Recorded Future
    adapter: greenhouse
    # Threat intelligence platform (acquired by Mastercard 2024).
    # Hires intel analysts, detection engineers, and red teamers.
    config:
      board_token: recordedfuture

