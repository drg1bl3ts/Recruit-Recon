# RecruitRecon — company configuration
# Adapters: greenhouse | lever | workable | workday | html_scraper | static
# Add new entries here; recon.py picks them up automatically.

# --- title keywords that mark a posting as relevant ---
# matched case-insensitively, substring match against the job title
title_keywords:
  # --- Offensive / pen test ---
  - penetration test
  - pen test
  - pentest
  - pentester
  - offensive security
  - red team
  - red-team
  - application security
  - appsec
  - vector command
  - attack surface
  - security consultant
  - security engineer
  - vulnerability research

  # --- Blue team / defensive ---
  - soc analyst
  - security operations
  - incident response
  - incident responder
  - threat hunt
  - threat intel
  - threat intelligence
  - detection engineer
  - detection engineering
  - blue team
  - purple team
  - digital forensics
  - dfir
  - malware analyst
  - reverse engineer
  - security analyst
  - cyber defense
  - cybersecurity analyst
  - information security analyst
  - infosec analyst
  - siem
  - soar
  - endpoint security
  - network security analyst

  # --- Adjacent / entry-point roles ---
  - security specialist
  - security associate
  - junior analyst
  - associate analyst
  - it security

# --- certifications to flag in job descriptions ---
# regex matched against description text
certs_to_flag:
  # --- SANS: your roadmap ---
  - GFACT
  - GSEC
  - GCIH
  - GPEN

  # --- SANS: blue team adjacent ---
  - GCFA
  - GCFE
  - GREM
  - GNFA
  - GMON
  - GCDA
  - GCTI
  - GDAT
  - GCIA

  # --- SANS: pen test adjacent ---
  - GWAPT
  - GXPN

  # --- Vendor / industry ---
  - CISSP
  - CEH
  - Security+
  - CySA+
  - CASP+
  - OSCP
  - OSEP
  - OSWE
  - OSCE
  - OSED
  - PNPT
  - PJPT
  - CPTS
  - BSCP
  - CRTO
  - CCD
  - BTL1
  - BTL2
  - eJPT
  - eCPPT

# --- explicit cert markers that push a job into Tier A ---
# Any job whose description mentions ANY cert in this list gets promoted to
# Tier A on the board (along with a GPEN-style badge). This is how you tell
# the collector "these are certs I have or am actively working toward —
# prioritize jobs that want them."
#
# As you pass each cert, leave it in the list (a job mentioning GFACT won't
# hurt you after you've passed it). Add the next cert as you start studying it.
# Historical name `gpen_marker` is preserved for back-compat — it accepts
# either a single string or a list.
gpen_marker:
  - GFACT
  - GSEC
  - GCIH
  - GPEN

# --- companies to monitor ---
companies:

